<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Welcome!</h2>

        <form id="loginForm" novalidate onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                <div id="usernameError" class="error" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div id="passwordError" class="error" aria-live="polite"></div>
            </div>

            <div class="form-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe" checked>
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <div id="successMessage" class="success" role="status" aria-live="polite"></div>
        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
